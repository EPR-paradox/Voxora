[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxora-backend"
version = "0.1.0"
description = "FastAPI backend for Voxora"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
# Speech is optional and heavy: the models run to hundreds of megabytes, and neither running the
# test suite nor working on the API needs them. Install with `pip install -e ".[speech]"`.
# `faster_whisper` transcribes (design §7.11), `piper-tts` speaks locally (§7.13, the default),
# `edge-tts` is the cloud synthesiser kept as an alternative implementation.
speech = [
    "edge-tts>=7,<8",
    "faster-whisper>=1.2,<2",
    "piper-tts>=1.8,<2",
]
dev = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
