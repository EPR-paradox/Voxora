services:
  postgres:
    image: postgres:16-alpine
    # Come back after a reboot. The API is useless without its database, and a container that only
    # starts when someone remembers to run `docker compose up` is not a service.
    restart: unless-stopped
    environment:
      POSTGRES_DB: voxora
      POSTGRES_USER: voxora
      POSTGRES_PASSWORD: voxora_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxora -d voxora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
