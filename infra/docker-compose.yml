services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voxora
      POSTGRES_USER: voxora
      POSTGRES_PASSWORD: voxora_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxora -d voxora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
